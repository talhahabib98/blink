server:
  port: 8080

spring:
  application:
    name: blink-url-shortener

blink:
  base-url: http://localhost:8080
  short-code:
    length: 7
  default-expiry-days: 365
  cleanup:
    interval-ms: 3600000
  rate-limit:
    enabled: true
    requests-per-minute: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.blink.urlshortener: INFO
